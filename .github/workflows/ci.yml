name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_API_KEY: test-key
      SQLITE_DB_PATH: ${{ runner.temp }}/chatbot-test.db
      RAG_STORE_DIR: ${{ runner.temp }}/rag-stores

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-docker.txt pytest

      - name: Compile Python modules
        run: python -m compileall -q langraph_rag_backend_dep.py streamlit_rag_frontend_dep.py

      - name: Run tests
        run: python -m pytest -q
